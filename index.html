<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Hub</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 Game Hub</h1>
            <p class="subtitle">Выберите игру для запуска</p>
        </header>

        <div id="loading" style="text-align:center; padding:50px; color:#888;">
            ⏳ Загрузка игр...
        </div>

        <main id="gameGrid" style="display:none;">
            <!-- Карточки игр будут вставлены скриптом -->
        </main>
    </div>

    <div id="contextMenu" class="context-menu hidden">
        <ul id="menuList">
            <!-- Пункты меню будут вставлены скриптом -->
        </ul>
    </div>

    <script src="scripts/main.js"></script>
</body>
</html>
